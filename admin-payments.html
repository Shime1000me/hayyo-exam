<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Payments Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .admin-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s;
            border-left: 4px solid #667eea;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a2e;
        }
        .stat-card .label {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .stat-card .icon {
            font-size: 2.5rem;
            opacity: 0.3;
            float: right;
        }
        .payment-table {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }
        .payment-table thead {
            background: #f8f9fa;
        }
        .payment-table th {
            font-weight: 600;
            color: #1a1a2e;
            border-bottom: 2px solid #e9ecef;
        }
        .status-badge {
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .status-approved {
            background: #d4edda;
            color: #155724;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }
        .search-box {
            border-radius: 50px;
            padding: 10px 20px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
        }
        .search-box:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .filter-btn {
            border-radius: 50px;
            padding: 8px 20px;
            margin: 0 5px;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .payment-modal .modal-content {
            border-radius: 20px;
            border: none;
        }
        .payment-modal .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px 20px 0 0;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .detail-label {
            font-weight: 500;
            color: #6c757d;
        }
        .detail-value {
            font-weight: 600;
            color: #1a1a2e;
        }
        .feedback-msg {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 400px;
        }
        .pagination-custom .page-link {
            border-radius: 8px;
            margin: 0 3px;
            color: #667eea;
        }
        .pagination-custom .page-item.active .page-link {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }
        .export-btn {
            border-radius: 50px;
            padding: 8px 20px;
        }
    </style>
</head>
<body>
    <!-- Feedback Messages -->
    <div class="feedback-msg" id="feedbackMsg"></div>

    <!-- Admin Header -->
    <div class="admin-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1 class="display-6 fw-bold mb-2">
                        <i class="bi bi-credit-card me-2"></i>Payments Management
                    </h1>
                    <p class="mb-0 opacity-75">
                        <i class="bi bi-person me-1"></i>Admin Dashboard
                    </p>
                </div>
                <div class="col-md-6 text-md-end mt-3 mt-md-0">
                    <button class="btn btn-light me-2" onclick="refreshData()">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                    <button class="btn btn-success" onclick="exportData()">
                        <i class="bi bi-download"></i> Export CSV
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mb-5">
        <!-- Statistics -->
        <div class="row g-4 mb-4">
            <div class="col-md-3 col-sm-6">
                <div class="stat-card">
                    <div class="icon"><i class="bi bi-cash-stack"></i></div>
                    <div class="number" id="totalRevenue">₦0</div>
                    <div class="label">Total Revenue</div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="stat-card" style="border-left-color: #28a745;">
                    <div class="icon"><i class="bi bi-check-circle"></i></div>
                    <div class="number" id="totalPayments">0</div>
                    <div class="label">Total Payments</div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="stat-card" style="border-left-color: #ffc107;">
                    <div class="icon"><i class="bi bi-clock"></i></div>
                    <div class="number" id="pendingPayments">0</div>
                    <div class="label">Pending</div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="stat-card" style="border-left-color: #17a2b8;">
                    <div class="icon"><i class="bi bi-people"></i></div>
                    <div class="number" id="uniqueStudents">0</div>
                    <div class="label">Unique Students</div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <input type="text" class="search-box w-100" id="searchInput" placeholder="🔍 Search by student name, email, or transaction ID...">
            </div>
            <div class="col-md-8">
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <span class="text-muted me-2">Filter:</span>
                    <button class="btn btn-outline-secondary filter-btn active" data-filter="all">All</button>
                    <button class="btn btn-outline-success filter-btn" data-filter="approved">Approved</button>
                    <button class="btn btn-outline-warning filter-btn" data-filter="pending">Pending</button>
                    <button class="btn btn-outline-danger filter-btn" data-filter="rejected">Rejected</button>
                    <span class="text-muted ms-2 me-2">|</span>
                    <input type="date" class="form-control form-control-sm" id="dateFilter" style="width: auto;">
                </div>
            </div>
        </div>

        <!-- Payments Table -->
        <div class="payment-table">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Transaction ID</th>
                            <th>Student</th>
                            <th>Exam</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="paymentsTableBody">
                        <tr>
                            <td colspan="7" class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="p-3 bg-light d-flex justify-content-between align-items-center">
                <span id="paymentCount" class="text-muted">Showing 0 payments</span>
                <nav>
                    <ul class="pagination pagination-custom mb-0" id="pagination">
                        <!-- Pagination will be rendered here -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Payment Detail Modal -->
    <div class="modal fade payment-modal" id="paymentModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-receipt me-2"></i>Payment Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="paymentDetails">
                    <!-- Details will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button class="btn btn-primary" onclick="openStatusModal()">
                        <i class="bi bi-pencil"></i> Update Status
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Update Status Modal -->
    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Payment Status</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="statusForm">
                        <div class="mb-3">
                            <label class="form-label">Payment ID</label>
                            <input type="text" class="form-control" id="statusPaymentId" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Status</label>
                            <select class="form-select" id="newStatus">
                                <option value="pending">Pending</option>
                                <option value="approved">Approved</option>
                                <option value="rejected">Rejected</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Notes (optional)</label>
                            <textarea class="form-control" id="statusNotes" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" onclick="confirmStatusUpdate()">
                        <i class="bi bi-check-circle"></i> Update
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ============================================================
        // 1. API Base URL
        // ============================================================
        const API_BASE = 'https://hayyo-exam.onrender.com';

        // ============================================================
        // 2. Global State
        // ============================================================
        let payments = [];
        let filteredPayments = [];
        let currentPage = 1;
        const pageSize = 10;
        let selectedPaymentId = null;
        let currentFilter = 'all';

        // DOM elements
        const paymentsTableBody = document.getElementById('paymentsTableBody');
        const pagination = document.getElementById('pagination');
        const paymentCount = document.getElementById('paymentCount');
        const searchInput = document.getElementById('searchInput');
        const dateFilter = document.getElementById('dateFilter');
        const totalRevenue = document.getElementById('totalRevenue');
        const totalPayments = document.getElementById('totalPayments');
        const pendingPayments = document.getElementById('pendingPayments');
        const uniqueStudents = document.getElementById('uniqueStudents');
        const paymentModal = new bootstrap.Modal(document.getElementById('paymentModal'));
        const statusModal = new bootstrap.Modal(document.getElementById('statusModal'));
        const feedbackMsg = document.getElementById('feedbackMsg');

        // ============================================================
        // 3. Helper Functions
        // ============================================================
        function showFeedback(message, type = 'success') {
            const bgColor = type === 'success' ? '#d4edda' : type === 'error' ? '#f8d7da' : '#fff3cd';
            const textColor = type === 'success' ? '#155724' : type === 'error' ? '#721c24' : '#856404';
            feedbackMsg.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert" style="background: ${bgColor}; color: ${textColor}; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => {
                const alert = feedbackMsg.querySelector('.alert');
                if (alert) alert.classList.remove('show');
            }, 5000);
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-NG', {
                style: 'currency',
                currency: 'NGN',
                minimumFractionDigits: 0
            }).format(amount);
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getStatusBadge(status) {
            const statusMap = {
                'approved': 'status-approved',
                'pending': 'status-pending',
                'rejected': 'status-rejected'
            };
            return `status-badge ${statusMap[status] || 'status-pending'}`;
        }

        function getStatusIcon(status) {
            const icons = {
                'approved': 'bi-check-circle',
                'pending': 'bi-clock',
                'rejected': 'bi-x-circle'
            };
            return icons[status] || 'bi-circle';
        }

        // ============================================================
        // 4. Load Data
        // ============================================================
        function loadPayments() {
            fetch(`${API_BASE}/api/admin/payments`, {
                headers: {
                    'Authorization': 'Bearer ' + (localStorage.getItem('token') || ''),
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    payments = data.payments || [];
                    updateStats();
                    applyFilters();
                } else {
                    showFeedback('Failed to load payments: ' + (data.message || 'Unknown error'), 'error');
                }
            })
            .catch(error => {
                console.error('Load payments error:', error);
                showFeedback('Network error loading payments.', 'error');
            });
        }

        // ============================================================
        // 5. Update Statistics
        // ============================================================
        function updateStats() {
            const total = payments.reduce((sum, p) => sum + (p.amount || 0), 0);
            const approved = payments.filter(p => p.status === 'approved').length;
            const pending = payments.filter(p => p.status === 'pending').length;
            const unique = new Set(payments.map(p => p.user_id)).size;

            totalRevenue.textContent = formatCurrency(total);
            totalPayments.textContent = payments.length;
            pendingPayments.textContent = pending;
            uniqueStudents.textContent = unique;
        }

        // ============================================================
        // 6. Filter & Search
        // ============================================================
        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const dateValue = dateFilter.value;

            filteredPayments = payments.filter(p => {
                if (currentFilter !== 'all' && p.status !== currentFilter) return false;
                if (dateValue) {
                    const paymentDate = new Date(p.created_at).toISOString().split('T')[0];
                    if (paymentDate !== dateValue) return false;
                }
                if (searchTerm) {
                    const searchable = `${p.id || ''} ${p.student_name || ''} ${p.student_email || ''} ${p.exam_title || ''}`.toLowerCase();
                    if (!searchable.includes(searchTerm)) return false;
                }
                return true;
            });

            currentPage = 1;
            renderTable();
        }

        // ============================================================
        // 7. Render Table
        // ============================================================
        function renderTable() {
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageItems = filteredPayments.slice(start, end);

            if (pageItems.length === 0) {
                paymentsTableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center py-4 text-muted">
                            <i class="bi bi-inbox display-4 d-block mb-2"></i>
                            No payments found
                        </td>
                    </tr>
                `;
            } else {
                paymentsTableBody.innerHTML = pageItems.map(p => `
                    <tr>
                        <td><code>${p.id || 'N/A'}</code></td>
                        <td>
                            <strong>${p.student_name || 'Unknown'}</strong><br>
                            <small class="text-muted">${p.student_email || ''}</small>
                        </td>
                        <td>${p.exam_title || 'N/A'}</td>
                        <td><strong>${formatCurrency(p.amount || 0)}</strong></td>
                        <td>${formatDate(p.created_at)}</td>
                        <td>
                            <span class="${getStatusBadge(p.status)}">
                                <i class="bi ${getStatusIcon(p.status)} me-1"></i>
                                ${p.status || 'pending'}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="viewPayment('${p.id}')">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="editPayment('${p.id}')">
                                <i class="bi bi-pencil"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            paymentCount.textContent = `Showing ${filteredPayments.length} payments`;
            renderPagination();
        }

        // ============================================================
        // 8. Pagination
        // ============================================================
        function renderPagination() {
            const totalPages = Math.ceil(filteredPayments.length / pageSize);
            let html = '';

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">&laquo;</a>
            </li>`;

            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    html += `<li class="page-item active"><span class="page-link">${i}</span></li>`;
                } else if (i <= 3 || i > totalPages - 3 || Math.abs(i - currentPage) <= 1) {
                    html += `<li class="page-item"><a class="page-link" href="#" onclick="changePage(${i})">${i}</a></li>`;
                } else if (i === 4 && currentPage > 5) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                } else if (i === totalPages - 3 && currentPage < totalPages - 4) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }

            html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">&raquo;</a>
            </li>`;

            pagination.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredPayments.length / pageSize);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
        }

        // ============================================================
        // 9. View & Edit Payment
        // ============================================================
        function viewPayment(id) {
            const payment = payments.find(p => p.id === id);
            if (!payment) {
                showFeedback('Payment not found.', 'error');
                return;
            }

            document.getElementById('paymentDetails').innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <h6 class="text-muted mb-3">Payment Information</h6>
                        <div class="detail-row">
                            <span class="detail-label">Transaction ID</span>
                            <span class="detail-value"><code>${payment.id || 'N/A'}</code></span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Amount</span>
                            <span class="detail-value">${formatCurrency(payment.amount || 0)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Status</span>
                            <span class="detail-value">
                                <span class="${getStatusBadge(payment.status)}">
                                    <i class="bi ${getStatusIcon(payment.status)} me-1"></i>
                                    ${payment.status || 'pending'}
                                </span>
                            </span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Payment Method</span>
                            <span class="detail-value">${payment.payment_method || 'N/A'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Date</span>
                            <span class="detail-value">${formatDate(payment.created_at)}</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h6 class="text-muted mb-3">Student Information</h6>
                        <div class="detail-row">
                            <span class="detail-label">Name</span>
                            <span class="detail-value">${payment.student_name || 'Unknown'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Email</span>
                            <span class="detail-value">${payment.student_email || 'N/A'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Student ID</span>
                            <span class="detail-value"><code>${payment.user_id || 'N/A'}</code></span>
                        </div>
                        <h6 class="text-muted mt-3 mb-3">Exam Information</h6>
                        <div class="detail-row">
                            <span class="detail-label">Exam</span>
                            <span class="detail-value">${payment.exam_title || 'N/A'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Exam ID</span>
                            <span class="detail-value"><code>${payment.exam_id || 'N/A'}</code></span>
                        </div>
                    </div>
                </div>
                ${payment.admin_notes ? `<div class="mt-3"><strong>Notes:</strong> ${payment.admin_notes}</div>` : ''}
            `;

            selectedPaymentId = id;
            paymentModal.show();
        }

        function editPayment(id) {
            const payment = payments.find(p => p.id === id);
            if (!payment) {
                showFeedback('Payment not found.', 'error');
                return;
            }

            document.getElementById('statusPaymentId').value = id;
            document.getElementById('newStatus').value = payment.status || 'pending';
            document.getElementById('statusNotes').value = '';
            selectedPaymentId = id;
            paymentModal.hide();
            statusModal.show();
        }

        function openStatusModal() {
            if (!selectedPaymentId) {
                showFeedback('No payment selected.', 'error');
                return;
            }
            const payment = payments.find(p => p.id === selectedPaymentId);
            if (payment) {
                document.getElementById('statusPaymentId').value = selectedPaymentId;
                document.getElementById('newStatus').value = payment.status || 'pending';
                document.getElementById('statusNotes').value = '';
                paymentModal.hide();
                statusModal.show();
            }
        }

        // ============================================================
        // 10. Update Status - FIXED ENDPOINTS
        // ============================================================
        function confirmStatusUpdate() {
            const id = document.getElementById('statusPaymentId').value;
            const status = document.getElementById('newStatus').value;
            const notes = document.getElementById('statusNotes').value;

            let endpoint = '';
            if (status === 'approved') {
                endpoint = `${API_BASE}/api/admin/payments/${id}/approve`;
            } else if (status === 'rejected') {
                endpoint = `${API_BASE}/api/admin/payments/${id}/reject`;
            } else {
                showFeedback('Invalid status selected.', 'error');
                return;
            }

            const body = status === 'rejected' ? JSON.stringify({ reason: notes || 'Rejected by admin' }) : '{}';

            fetch(endpoint, {
                method: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + (localStorage.getItem('token') || ''),
                    'Content-Type': 'application/json',
                },
                body: body
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showFeedback('Payment status updated successfully!', 'success');
                    statusModal.hide();
                    loadPayments();
                } else {
                    showFeedback('Failed to update status: ' + (data.message || 'Unknown error'), 'error');
                }
            })
            .catch(error => {
                console.error('Update status error:', error);
                showFeedback('Network error updating status.', 'error');
            });
        }

        // ============================================================
        // 11. Export Data
        // ============================================================
        function exportData() {
            if (filteredPayments.length === 0) {
                showFeedback('No data to export.', 'error');
                return;
            }

            const headers = ['Transaction ID', 'Student Name', 'Student Email', 'Exam', 'Amount', 'Status', 'Date', 'Payment Method', 'Notes'];
            const rows = filteredPayments.map(p => [
                p.id || '',
                p.student_name || '',
                p.student_email || '',
                p.exam_title || '',
                p.amount || 0,
                p.status || 'pending',
                formatDate(p.created_at),
                p.payment_method || '',
                p.admin_notes || ''
            ]);

            let csv = headers.join(',') + '\n';
            rows.forEach(row => {
                csv += row.map(cell => `"${cell}"`).join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `payments_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showFeedback('Data exported successfully!', 'success');
        }

        // ============================================================
        // 12. Refresh
        // ============================================================
        function refreshData() {
            showFeedback('Refreshing data...', 'info');
            loadPayments();
        }

        // ============================================================
        // 13. Event Listeners
        // ============================================================
        searchInput.addEventListener('input', applyFilters);
        dateFilter.addEventListener('change', applyFilters);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                applyFilters();
            });
        });

        // ============================================================
        // 14. Initialize
        // ============================================================
        document.addEventListener('DOMContentLoaded', loadPayments);

        // Make functions globally accessible
        window.viewPayment = viewPayment;
        window.editPayment = editPayment;
        window.openStatusModal = openStatusModal;
        window.confirmStatusUpdate = confirmStatusUpdate;
        window.changePage = changePage;
        window.exportData = exportData;
        window.refreshData = refreshData;
    </script>
</body>
</html>
