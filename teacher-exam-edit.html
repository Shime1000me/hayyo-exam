<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create/Edit Exam - HAYYO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .exam-edit-header {
            background: linear-gradient(135deg, #2d3436 0%, #636e72 100%);
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .form-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }
        .form-card .card-title {
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0984e3;
            box-shadow: 0 0 0 3px rgba(9, 132, 227, 0.2);
        }
        .form-label {
            font-weight: 500;
            color: #2d3436;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0984e3 0%, #6c5ce7 100%);
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 600;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(9, 132, 227, 0.3);
        }
        .btn-secondary {
            border-radius: 50px;
            padding: 12px 30px;
        }
        .status-badge {
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.85rem;
        }
        .status-badge.active {
            background: #d4edda;
            color: #155724;
        }
        .status-badge.inactive {
            background: #f8d7da;
            color: #721c24;
        }
        .status-badge.draft {
            background: #fff3cd;
            color: #856404;
        }
        .feedback-msg {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 400px;
        }
        .preview-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        .question-preview {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #0984e3;
        }
        .delete-btn {
            color: #dc3545;
            cursor: pointer;
            transition: all 0.3s;
        }
        .delete-btn:hover {
            transform: scale(1.2);
        }
        .inline-edit {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .inline-edit .form-control {
            flex: 1;
        }
        .option-group {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .option-group .form-check-input {
            margin-top: 10px;
        }
        .question-number {
            font-weight: 600;
            color: #0984e3;
            margin-right: 10px;
        }
        .drag-handle {
            cursor: move;
            color: #6c757d;
            margin-right: 10px;
        }
        .question-type-badge {
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            background: #e9ecef;
            color: #2d3436;
        }
        .question-type-badge.mcq { background: #dbeafe; color: #1e40af; }
        .question-type-badge.truefalse { background: #d1fae5; color: #065f46; }
        .question-type-badge.fill { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>
    <!-- Feedback Messages -->
    <div class="feedback-msg" id="feedbackMsg"></div>

    <!-- Header -->
    <div class="exam-edit-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1 class="display-6 fw-bold mb-2">
                        <i class="bi bi-file-earmark-text me-2"></i>
                        <span id="pageTitle">Create New Exam</span>
                    </h1>
                    <p class="mb-0 opacity-75" id="examStatus">Status: <span class="status-badge draft">Draft</span></p>
                </div>
                <div class="col-md-6 text-md-end mt-3 mt-md-0">
                    <button class="btn btn-light me-2" onclick="previewExam()">
                        <i class="bi bi-eye"></i> Preview
                    </button>
                    <button class="btn btn-success" onclick="saveExam()">
                        <i class="bi bi-check-circle"></i> Save Exam
                    </button>
                    <a href="teacher-dashboard.html" class="btn btn-outline-light">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mb-5">
        <form id="examForm">
            <!-- Basic Information -->
            <div class="form-card">
                <h5 class="card-title"><i class="bi bi-info-circle me-2"></i>Basic Information</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Exam Title *</label>
                        <input type="text" class="form-control" id="examTitle" placeholder="Enter exam title" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Subject *</label>
                        <input type="text" class="form-control" id="examSubject" placeholder="e.g., Mathematics" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Time Limit (minutes) *</label>
                        <input type="number" class="form-control" id="examTimeLimit" placeholder="180" value="180" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Passing Score (%) *</label>
                        <input type="number" class="form-control" id="examPassingScore" placeholder="40" value="40" required>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="examDescription" rows="3" placeholder="Enter exam description"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="examStatusSelect">
                            <option value="draft">Draft</option>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Price (₦)</label>
                        <input type="number" class="form-control" id="examPrice" placeholder="0" value="0">
                    </div>
                </div>
            </div>

            <!-- Questions Section -->
            <div class="form-card">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0"><i class="bi bi-question-circle me-2"></i>Questions</h5>
                    <button type="button" class="btn btn-primary btn-sm" onclick="addQuestion()">
                        <i class="bi bi-plus-circle"></i> Add Question
                    </button>
                </div>
                <div id="questionsContainer" class="mt-3">
                    <!-- Questions will be rendered here -->
                </div>
            </div>
        </form>
    </div>

    <!-- Question Modal -->
    <div class="modal fade" id="questionModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-question-circle me-2"></i><span id="questionModalTitle">Add Question</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="questionForm">
                        <input type="hidden" id="questionEditIndex" value="-1">
                        
                        <div class="mb-3">
                            <label class="form-label">Question Text *</label>
                            <textarea class="form-control" id="questionText" rows="2" placeholder="Enter question text" required></textarea>
                        </div>
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Question Type</label>
                                <select class="form-select" id="questionType">
                                    <option value="mcq">Multiple Choice</option>
                                    <option value="truefalse">True/False</option>
                                    <option value="fill">Fill in the Blank</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Marks *</label>
                                <input type="number" class="form-control" id="questionMarks" placeholder="1" value="1" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Image URL (optional)</label>
                            <input type="url" class="form-control" id="questionImage" placeholder="https://example.com/image.jpg">
                        </div>
                        
                        <div id="optionsContainer" class="mb-3">
                            <label class="form-label">Options *</label>
                            <div id="optionsList">
                                <!-- Options will be rendered here -->
                            </div>
                            <button type="button" class="btn btn-outline-primary btn-sm mt-2" onclick="addOption()">
                                <i class="bi bi-plus-circle"></i> Add Option
                            </button>
                        </div>
                        
                        <div class="mb-3" id="fillAnswerContainer" style="display: none;">
                            <label class="form-label">Correct Answer</label>
                            <input type="text" class="form-control" id="fillAnswer" placeholder="Enter the correct answer">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Explanation (optional)</label>
                            <textarea class="form-control" id="questionExplanation" rows="2" placeholder="Explain the answer"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" onclick="saveQuestion()">
                        <i class="bi bi-check-circle"></i> Save Question
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal fade" id="previewModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-eye me-2"></i>Exam Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="previewContent">
                    <!-- Preview will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ============================================================
        // 1. API Base URL - UPDATED
        // ============================================================
        const API_BASE = 'https://hayyo-exam.onrender.com';

        // ============================================================
        // 2. Global State
        // ============================================================
        let questions = [];
        let editingExamId = null;
        let questionModalInstance = null;
        let previewModalInstance = null;

        // DOM elements
        const feedbackMsg = document.getElementById('feedbackMsg');
        const questionsContainer = document.getElementById('questionsContainer');
        const pageTitle = document.getElementById('pageTitle');
        const examStatus = document.getElementById('examStatus');

        // ============================================================
        // 3. Helper Functions
        // ============================================================
        function showFeedback(message, type = 'success') {
            const bgColor = type === 'success' ? '#d4edda' : type === 'error' ? '#f8d7da' : '#fff3cd';
            const textColor = type === 'success' ? '#155724' : type === 'error' ? '#721c24' : '#856404';
            feedbackMsg.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert" style="background: ${bgColor}; color: ${textColor}; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => {
                const alert = feedbackMsg.querySelector('.alert');
                if (alert) alert.classList.remove('show');
            }, 5000);
        }

        function getQuestionTypeBadge(type) {
            const map = {
                'mcq': 'mcq',
                'truefalse': 'truefalse',
                'fill': 'fill'
            };
            return map[type] || 'mcq';
        }

        function getOptionLabel(index) {
            return String.fromCharCode(65 + index);
        }

        // ============================================================
        // 4. Render Questions
        // ============================================================
        function renderQuestions() {
            if (questions.length === 0) {
                questionsContainer.innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-question-circle display-4 d-block mb-3"></i>
                        <p>No questions added yet.</p>
                        <button class="btn btn-primary btn-sm" onclick="addQuestion()">
                            <i class="bi bi-plus-circle"></i> Add Your First Question
                        </button>
                    </div>
                `;
                return;
            }

            questionsContainer.innerHTML = questions.map((q, index) => `
                <div class="question-preview">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <span class="question-number">Q${index + 1}</span>
                            <span class="question-type-badge ${getQuestionTypeBadge(q.type)}">${q.type || 'mcq'}</span>
                            <span class="badge bg-secondary">${q.marks || 1} mark${q.marks > 1 ? 's' : ''}</span>
                            <span class="ms-2">${q.question_text || 'Question text'}</span>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="editQuestion(${index})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteQuestion(${index})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                    ${q.options && q.options.length > 0 ? `
                        <div class="mt-2">
                            ${q.options.map((opt, optIndex) => `
                                <div class="small">
                                    ${getOptionLabel(optIndex)}. ${opt.option_text || opt}
                                    ${opt.is_correct ? ' <span class="badge bg-success">✓</span>' : ''}
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                    ${q.correct_answer ? `<div class="mt-2 small text-success">Answer: ${q.correct_answer}</div>` : ''}
                </div>
            `).join('');
        }

        // ============================================================
        // 5. Question CRUD
        // ============================================================
        function addQuestion() {
            document.getElementById('questionModalTitle').textContent = 'Add Question';
            document.getElementById('questionEditIndex').value = '-1';
            document.getElementById('questionText').value = '';
            document.getElementById('questionType').value = 'mcq';
            document.getElementById('questionMarks').value = '1';
            document.getElementById('questionImage').value = '';
            document.getElementById('questionExplanation').value = '';
            document.getElementById('fillAnswer').value = '';
            document.getElementById('fillAnswerContainer').style.display = 'none';
            
            // Reset options
            document.getElementById('optionsList').innerHTML = `
                <div class="option-group">
                    <div class="d-flex gap-2">
                        <div class="flex-grow-1">
                            <input type="text" class="form-control" placeholder="Option A" data-opt-index="0">
                        </div>
                        <div class="form-check d-flex align-items-center">
                            <input class="form-check-input" type="radio" name="correctOption" value="0">
                            <label class="form-check-label ms-1">Correct</label>
                        </div>
                        <button class="btn btn-sm btn-outline-danger" onclick="removeOption(this)">✕</button>
                    </div>
                </div>
                <div class="option-group">
                    <div class="d-flex gap-2">
                        <div class="flex-grow-1">
                            <input type="text" class="form-control" placeholder="Option B" data-opt-index="1">
                        </div>
                        <div class="form-check d-flex align-items-center">
                            <input class="form-check-input" type="radio" name="correctOption" value="1">
                            <label class="form-check-label ms-1">Correct</label>
                        </div>
                        <button class="btn btn-sm btn-outline-danger" onclick="removeOption(this)">✕</button>
                    </div>
                </div>
            `;
            
            // Show modal
            if (!questionModalInstance) {
                questionModalInstance = new bootstrap.Modal(document.getElementById('questionModal'));
            }
            questionModalInstance.show();
        }

        function editQuestion(index) {
            const q = questions[index];
            if (!q) return;

            document.getElementById('questionModalTitle').textContent = 'Edit Question';
            document.getElementById('questionEditIndex').value = index;
            document.getElementById('questionText').value = q.question_text || '';
            document.getElementById('questionType').value = q.type || 'mcq';
            document.getElementById('questionMarks').value = q.marks || 1;
            document.getElementById('questionImage').value = q.image_url || '';
            document.getElementById('questionExplanation').value = q.explanation || '';
            document.getElementById('fillAnswer').value = q.correct_answer || '';

            // Handle fill in the blank
            if (q.type === 'fill') {
                document.getElementById('fillAnswerContainer').style.display = 'block';
            } else {
                document.getElementById('fillAnswerContainer').style.display = 'none';
            }

            // Render options
            let optionsHtml = '';
            if (q.options && q.options.length > 0) {
                q.options.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <div class="option-group">
                            <div class="d-flex gap-2">
                                <div class="flex-grow-1">
                                    <input type="text" class="form-control" placeholder="Option ${getOptionLabel(optIndex)}" 
                                           data-opt-index="${optIndex}" value="${opt.option_text || opt}">
                                </div>
                                <div class="form-check d-flex align-items-center">
                                    <input class="form-check-input" type="radio" name="correctOption" value="${optIndex}" 
                                           ${opt.is_correct ? 'checked' : ''}>
                                    <label class="form-check-label ms-1">Correct</label>
                                </div>
                                <button class="btn btn-sm btn-outline-danger" onclick="removeOption(this)">✕</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                optionsHtml = `
                    <div class="option-group">
                        <div class="d-flex gap-2">
                            <div class="flex-grow-1">
                                <input type="text" class="form-control" placeholder="Option A" data-opt-index="0">
                            </div>
                            <div class="form-check d-flex align-items-center">
                                <input class="form-check-input" type="radio" name="correctOption" value="0">
                                <label class="form-check-label ms-1">Correct</label>
                            </div>
                            <button class="btn btn-sm btn-outline-danger" onclick="removeOption(this)">✕</button>
                        </div>
                    </div>
                `;
            }
            document.getElementById('optionsList').innerHTML = optionsHtml;

            if (!questionModalInstance) {
                questionModalInstance = new bootstrap.Modal(document.getElementById('questionModal'));
            }
            questionModalInstance.show();
        }

        function saveQuestion() {
            const index = parseInt(document.getElementById('questionEditIndex').value);
            const questionText = document.getElementById('questionText').value.trim();
            const type = document.getElementById('questionType').value;
            const marks = parseInt(document.getElementById('questionMarks').value) || 1;
            const imageUrl = document.getElementById('questionImage').value.trim();
            const explanation = document.getElementById('questionExplanation').value.trim();
            const fillAnswer = document.getElementById('fillAnswer').value.trim();

            if (!questionText) {
                showFeedback('Please enter question text.', 'error');
                return;
            }

            let options = [];
            let correctAnswer = null;

            if (type === 'fill') {
                if (!fillAnswer) {
                    showFeedback('Please enter the correct answer.', 'error');
                    return;
                }
                correctAnswer = fillAnswer;
            } else {
                // Collect options
                const optionInputs = document.querySelectorAll('#optionsList .option-group');
                if (optionInputs.length < 2) {
                    showFeedback('Please add at least 2 options.', 'error');
                    return;
                }

                let hasCorrect = false;
                optionInputs.forEach((group) => {
                    const input = group.querySelector('input[type="text"]');
                    const radio = group.querySelector('input[type="radio"]');
                    const optText = input ? input.value.trim() : '';
                    if (optText) {
                        const isCorrect = radio ? radio.checked : false;
                        if (isCorrect) hasCorrect = true;
                        options.push({
                            option_text: optText,
                            is_correct: isCorrect
                        });
                    }
                });

                if (options.length < 2) {
                    showFeedback('Please add at least 2 options with text.', 'error');
                    return;
                }

                if (!hasCorrect) {
                    showFeedback('Please select a correct answer.', 'error');
                    return;
                }
            }

            const questionData = {
                question_text: questionText,
                type: type,
                marks: marks,
                image_url: imageUrl || null,
                explanation: explanation || null,
                options: options.length > 0 ? options : null,
                correct_answer: correctAnswer
            };

            if (index === -1) {
                questions.push(questionData);
                showFeedback('Question added successfully!', 'success');
            } else {
                questions[index] = questionData;
                showFeedback('Question updated successfully!', 'success');
            }

            renderQuestions();
            questionModalInstance.hide();
        }

        function deleteQuestion(index) {
            if (confirm('Are you sure you want to delete this question?')) {
                questions.splice(index, 1);
                renderQuestions();
                showFeedback('Question deleted.', 'info');
            }
        }

        function addOption() {
            const optionsList = document.getElementById('optionsList');
            const count = optionsList.querySelectorAll('.option-group').length;
            const newGroup = document.createElement('div');
            newGroup.className = 'option-group';
            newGroup.innerHTML = `
                <div class="d-flex gap-2">
                    <div class="flex-grow-1">
                        <input type="text" class="form-control" placeholder="Option ${getOptionLabel(count)}" data-opt-index="${count}">
                    </div>
                    <div class="form-check d-flex align-items-center">
                        <input class="form-check-input" type="radio" name="correctOption" value="${count}">
                        <label class="form-check-label ms-1">Correct</label>
                    </div>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeOption(this)">✕</button>
                </div>
            `;
            optionsList.appendChild(newGroup);
        }

        function removeOption(btn) {
            const group = btn.closest('.option-group');
            const optionsList = document.getElementById('optionsList');
            if (optionsList.querySelectorAll('.option-group').length <= 2) {
                showFeedback('You need at least 2 options.', 'error');
                return;
            }
            group.remove();
            // Re-index radio buttons
            document.querySelectorAll('#optionsList .option-group input[type="radio"]').forEach((radio, idx) => {
                radio.value = idx;
            });
        }

        // ============================================================
        // 6. Save Exam
        // ============================================================
        function saveExam() {
            const title = document.getElementById('examTitle').value.trim();
            const subject = document.getElementById('examSubject').value.trim();
            const timeLimit = parseInt(document.getElementById('examTimeLimit').value) || 180;
            const passingScore = parseInt(document.getElementById('examPassingScore').value) || 40;
            const description = document.getElementById('examDescription').value.trim();
            const status = document.getElementById('examStatusSelect').value;
            const price = parseFloat(document.getElementById('examPrice').value) || 0;

            if (!title) {
                showFeedback('Please enter exam title.', 'error');
                return;
            }
            if (!subject) {
                showFeedback('Please enter subject.', 'error');
                return;
            }
            if (questions.length === 0) {
                showFeedback('Please add at least one question.', 'error');
                return;
            }

            const examData = {
                title: title,
                subject: subject,
                time_limit: timeLimit,
                passing_score: passingScore,
                description: description,
                status: status,
                price: price,
                questions: questions
            };

            const url = editingExamId 
                ? `${API_BASE}/api/teacher/exams/${editingExamId}` 
                : `${API_BASE}/api/teacher/exams`;
            const method = editingExamId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(examData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showFeedback(editingExamId ? 'Exam updated successfully!' : 'Exam created successfully!', 'success');
                    if (!editingExamId) {
                        editingExamId = data.exam_id;
                        pageTitle.textContent = `Edit Exam: ${title}`;
                        window.history.replaceState({}, '', `?id=${data.exam_id}`);
                    }
                    // Update status display
                    updateStatusDisplay(status);
                } else {
                    showFeedback('Failed to save exam: ' + data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Save exam error:', error);
                showFeedback('Network error saving exam.', 'error');
            });
        }

        function updateStatusDisplay(status) {
            const statusMap = {
                'active': 'Active',
                'inactive': 'Inactive',
                'draft': 'Draft'
            };
            const statusClassMap = {
                'active': 'active',
                'inactive': 'inactive',
                'draft': 'draft'
            };
            examStatus.innerHTML = `Status: <span class="status-badge ${statusClassMap[status] || 'draft'}">${statusMap[status] || 'Draft'}</span>`;
        }

        // ============================================================
        // 7. Preview Exam
        // ============================================================
        function previewExam() {
            const title = document.getElementById('examTitle').value.trim() || 'Untitled Exam';
            const subject = document.getElementById('examSubject').value.trim() || 'Unknown Subject';
            const timeLimit = document.getElementById('examTimeLimit').value || 180;

            let previewHtml = `
                <h5>${title}</h5>
                <p class="text-muted">${subject} • ${timeLimit} minutes</p>
                <hr>
                <p><strong>Total Questions:</strong> ${questions.length}</p>
            `;

            if (questions.length === 0) {
                previewHtml += `<p class="text-muted">No questions added yet.</p>`;
            } else {
                questions.forEach((q, index) => {
                    previewHtml += `
                        <div class="question-preview">
                            <strong>Q${index + 1}.</strong> ${q.question_text || 'Question text'}
                            <span class="badge bg-secondary ms-2">${q.marks || 1} mark${q.marks > 1 ? 's' : ''}</span>
                    `;
                    if (q.options && q.options.length > 0) {
                        previewHtml += `<div class="mt-2">`;
                        q.options.forEach((opt, optIndex) => {
                            previewHtml += `
                                <div class="small">
                                    <input type="radio" disabled> ${getOptionLabel(optIndex)}. ${opt.option_text || opt}
                                    ${opt.is_correct ? ' ✓' : ''}
                                </div>
                            `;
                        });
                        previewHtml += `</div>`;
                    }
                    if (q.correct_answer) {
                        previewHtml += `<div class="mt-2 text-success"><strong>Answer:</strong> ${q.correct_answer}</div>`;
                    }
                    previewHtml += `</div>`;
                });
            }

            document.getElementById('previewContent').innerHTML = previewHtml;
            if (!previewModalInstance) {
                previewModalInstance = new bootstrap.Modal(document.getElementById('previewModal'));
            }
            previewModalInstance.show();
        }

        // ============================================================
        // 8. Load Existing Exam
        // ============================================================
        function loadExam() {
            const urlParams = new URLSearchParams(window.location.search);
            const examId = urlParams.get('id');

            if (!examId) return;

            editingExamId = examId;

            fetch(`${API_BASE}/api/teacher/exams/${examId}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const exam = data.exam;
                    document.getElementById('examTitle').value = exam.title || '';
                    document.getElementById('examSubject').value = exam.subject || '';
                    document.getElementById('examTimeLimit').value = exam.time_limit || 180;
                    document.getElementById('examPassingScore').value = exam.passing_score || 40;
                    document.getElementById('examDescription').value = exam.description || '';
                    document.getElementById('examStatusSelect').value = exam.status || 'draft';
                    document.getElementById('examPrice').value = exam.price || 0;
                    questions = exam.questions || [];
                    pageTitle.textContent = `Edit Exam: ${exam.title}`;
                    updateStatusDisplay(exam.status || 'draft');
                    renderQuestions();
                    showFeedback('Exam loaded successfully.', 'success');
                } else {
                    showFeedback('Failed to load exam: ' + data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Load exam error:', error);
                showFeedback('Network error loading exam.', 'error');
            });
        }

        // ============================================================
        // 9. Event Listeners
        // ============================================================
        document.getElementById('questionType').addEventListener('change', function() {
            const fillContainer = document.getElementById('fillAnswerContainer');
            if (this.value === 'fill') {
                fillContainer.style.display = 'block';
                document.getElementById('optionsContainer').style.display = 'none';
            } else {
                fillContainer.style.display = 'none';
                document.getElementById('optionsContainer').style.display = 'block';
            }
        });

        // ============================================================
        // 10. Initialize
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize question modal
            questionModalInstance = new bootstrap.Modal(document.getElementById('questionModal'));
            previewModalInstance = new bootstrap.Modal(document.getElementById('previewModal'));
            
            // Check if editing existing exam
            loadExam();
            
            // If no questions, render empty state
            renderQuestions();
        });

        // Make functions globally accessible
        window.addQuestion = addQuestion;
        window.editQuestion = editQuestion;
        window.saveQuestion = saveQuestion;
        window.deleteQuestion = deleteQuestion;
        window.addOption = addOption;
        window.removeOption = removeOption;
        window.saveExam = saveExam;
        window.previewExam = previewExam;
    </script>
</body>
</html>
