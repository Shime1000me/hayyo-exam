<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Hayyo Academy - Exam Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <style>
        /* --- YOUR BEAUTIFUL CSS REMAINS UNTOUCHED --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Raleway', 'Inter', sans-serif; background: #f8fafc; }
        .app-header { background: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; height: 48px; padding: 0 1rem; gap: 0.5rem; position: sticky; top: 0; z-index: 100; }
        .app-header .logo { font-size: 1.25rem; font-weight: 700; color: #2563eb; margin-right: 1rem; }
        .app-header nav { display: flex; align-items: stretch; height: 100%; }
        .app-header nav a { display: flex; align-items: center; padding: 0 0.75rem; font-size: 0.875rem; border-bottom: 2px solid transparent; text-decoration: none; color: #64748b; cursor: pointer; }
        .app-header nav a:hover { color: #0f172a; }
        .app-header nav a.active { border-bottom-color: #2563eb; color: #2563eb; font-weight: 500; }
        .app-header .user-menu { margin-left: auto; display: flex; align-items: center; gap: 0.75rem; }
        .app-header .user-menu .avatar { width: 28px; height: 28px; border-radius: 50%; background: #2563eb; color: white; font-size: 0.65rem; font-weight: 600; display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
        .app-header .logout { font-size: 12px; color: #dc2626; cursor: pointer; background: none; border: none; }
        .red-line { height: 2px; background: #dc2626; }

        .main-layout { display: flex; flex: 1; min-height: calc(100vh - 50px); }
        .sidebar { display: none; width: 208px; flex-shrink: 0; border-right: 1px solid #e2e8f0; background: #ffffff; min-height: 100%; }
        @media (min-width: 768px) { .sidebar { display: block; } }
        .sidebar .sidebar-title { padding: 0.75rem; font-size: 0.75rem; font-weight: 700; color: #0f172a; text-transform: uppercase; letter-spacing: 0.05em; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; }
        .sidebar .menu-item { padding: 0.625rem 0.75rem; font-size: 0.875rem; cursor: pointer; transition: background 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(15, 23, 42, 0.7); }
        .sidebar .menu-item:hover { background: #f1f5f9; }
        .sidebar .menu-item.active { background: #2563eb; color: white; }

        .main-content { flex: 1; min-width: 0; padding: 1rem; }
        @media (min-width: 768px) { .main-content { padding: 1rem 1.5rem; } }

        .info-box { border: 1px solid #e2e8f0; font-size: 0.875rem; width: 100%; margin-bottom: 1.5rem; }
        .info-box .info-header { background: #f1f5f9; padding: 0.375rem 1rem; font-weight: 600; color: #0f172a; border-bottom: 1px solid #e2e8f0; }
        .info-box .info-row { display: grid; grid-template-columns: 160px 1fr 160px 1fr; gap: 1.5rem; padding: 0.5rem 1rem; align-items: center; border-bottom: 1px solid #f1f5f9; }
        .info-box .info-row:last-child { border-bottom: none; }
        .info-box .info-row .label { font-weight: 600; color: #0f172a; white-space: nowrap; }
        .info-box .info-row .value { font-weight: 600; color: #0f172a; }

        .exam-section { margin-top: 1rem; }
        .exam-section h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-bottom: 0.25rem; }

        .exam-info-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 24px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .exam-info-card h2 { font-size: 1.5rem; font-weight: 700; color: #1d4ed8; margin-bottom: 8px; }
        .exam-info-card p { color: #64748b; margin-bottom: 20px; }
        
        .exam-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-bottom: 32px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 8px;
        }
        .stat-item { display: flex; flex-direction: column; gap: 4px; }
        .stat-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 600; }
        .stat-value { font-size: 1.25rem; font-weight: 700; color: #0f172a; }

        .btn-attempt {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 32px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
            width: 100%;
        }
        .btn-attempt:hover { background: #1d4ed8; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90%; }
        .toast.show { opacity: 1; }
        .toast.error { background: #dc2626; }
        .toast.success { background: #16a34a; }
        
        .loading-spinner { text-align: center; padding: 40px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 480px) { .info-box .info-row { grid-template-columns: 1fr 1fr; gap: 0.25rem 0.5rem; } .main-content { padding: 1rem; } .exam-stats { flex-direction: column; gap: 16px; } }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div id="root">
        <div style="min-height:100vh;background:#ffffff;display:flex;flex-direction:column;">

            <header class="app-header">
                <div class="logo">🏫 Hayyo</div>
                <nav>
                    <a href="dashboard.html">Home</a>
                    <a href="years.html" class="active">My exam</a>
                    <a href="my-results.html">My Results</a>
                </nav>
                <div class="user-menu">
                    <div class="avatar" id="userAvatar">ST</div>
                    <button class="logout" onclick="signOut()">Logout</button>
                </div>
            </header>
            <div class="red-line"></div>

            <div class="main-layout">
                <aside class="sidebar" id="sidebar">
                    <div class="sidebar-title">Exam Details</div>
                    <div class="menu-item active">Loading...</div>
                </aside>

                <main class="main-content">
                    <div class="info-box">
                        <div class="info-header">Basic Information</div>
                        <div class="info-row">
                            <span class="label">Full Name:</span>
                            <span class="value" id="userName">Loading...</span>
                            <span class="label">School:</span>
                            <span class="value">Hayyo Academy</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Email:</span>
                            <span class="value" id="userEmail">Loading...</span>
                            <span class="label">Admission Number:</span>
                            <span class="value">HAY001</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Exam Center:</span>
                            <span class="value">ADDIS ABABA</span>
                            <span class="label">Enrollment Type:</span>
                            <span class="value">Regular</span>
                        </div>
                    </div>

                    <div class="exam-section">
                        <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 0.75rem;">
                            <a href="#" id="backLink" style="color: #2563eb; text-decoration: none;">← Back to Rounds</a>
                        </div>
                        
                        <div id="examContainer">
                            <div class="loading-spinner">
                                <div class="spinner"></div>
                                <p>Loading exam details...</p>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js'

        let currentExam = null;
        let userProfile = null;

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        window.signOut = async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        };

        // Get Exam ID from URL
        const params = new URLSearchParams(window.location.search);
        const examId = params.get('id');

        if (!examId) {
            window.location.href = 'exams.html';
        }

        // Main Init
        (async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return window.location.href = 'index.html';

            // 1. Load User Profile
            const { data: profile } = await supabase.from('users').select('*').eq('id', session.user.id).single();
            userProfile = profile;
            
            if (profile) {
                const name = profile.name || session.user.email.split('@')[0];
                document.getElementById('userName').textContent = name.toUpperCase();
                document.getElementById('userEmail').textContent = profile.email;
                document.getElementById('userAvatar').textContent = name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            }

            // 2. Load Exam Details
            const { data: exam, error } = await supabase
                .from('exams')
                .select('*')
                .eq('id', examId)
                .single();

            if (error || !exam) {
                document.getElementById('examContainer').innerHTML = `
                    <div class="exam-info-card" style="color:#dc2626;">
                        <h2>Exam not found</h2>
                        <p>The exam you are looking for does not exist.</p>
                    </div>
                `;
                return;
            }

            currentExam = exam;

            // Update Back Link
            const backUrl = `exams.html?stream=${exam.stream}&year=${exam.year}&subject=${exam.subject}`;
            document.getElementById('backLink').href = backUrl;

            // Render Exam Info
            const isPaid = exam.type === 'paid';
            const isLocked = isPaid && !profile.is_paid;

            document.getElementById('examContainer').innerHTML = `
                <div class="exam-info-card">
                    <h2>${exam.subject} · ${exam.round || 'Standard Exam'}</h2>
                    <p>${exam.year} · ${exam.stream === 'natural' ? 'Natural Science' : 'Social Science'}</p>
                    
                    <div class="exam-stats">
                        <div class="stat-item">
                            <span class="stat-label">Time Limit</span>
                            <span class="stat-value">⏱ ${exam.time_limit} min</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Passing Score</span>
                            <span class="stat-value">🎯 ${exam.passing_score}%</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Exam Type</span>
                            <span class="stat-value">${isPaid ? '🔒 PAID' : '✅ FREE'}</span>
                        </div>
                    </div>

                    ${isLocked 
                        ? `<button class="btn-attempt" style="background:#f59e0b;" onclick="window.location.href='payment.html'">PAY TO UNLOCK</button>`
                        : `<button class="btn-attempt" onclick="startExam()">ATTEMPT EXAM</button>`
                    }
                </div>
            `;
        })();

        // 3. Start Exam Function
        window.startExam = async () => {
            const { data: { session } } = await supabase.auth.getSession();
            
            // Create the attempt in the database
            const { data: attempt, error } = await supabase
                .from('attempts')
                .insert({
                    exam_id: currentExam.id,
                    student_id: session.user.id,
                    question_snapshot: [], // Will be populated by take-exam
                    status: 'in_progress'
                })
                .select()
                .single();

            if (error) {
                showToast('Error starting exam: ' + error.message, 'error');
                return;
            }

            // Redirect to the actual exam page
            window.location.href = `take-exam.html?attempt_id=${attempt.id}`;
        };
    </script>
</body>
</html>
