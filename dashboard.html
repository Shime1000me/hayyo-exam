<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Hayyo Academy - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Raleway', 'Inter', sans-serif; background: #f8fafc; }
        .app-header {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            height: 48px;
            padding: 0 1rem;
            gap: 0.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .app-header .logo { font-size: 1.25rem; font-weight: 700; color: #2563eb; margin-right: 1rem; }
        .app-header nav { display: flex; align-items: stretch; height: 100%; }
        .app-header nav a {
            display: flex;
            align-items: center;
            padding: 0 0.75rem;
            font-size: 0.875rem;
            border-bottom: 2px solid transparent;
            text-decoration: none;
            color: #64748b;
            cursor: pointer;
        }
        .app-header nav a:hover { color: #0f172a; }
        .app-header nav a.active { border-bottom-color: #2563eb; color: #2563eb; font-weight: 500; }
        .app-header nav a.logout-btn { color: #dc2626; border-bottom-color: transparent; }
        .app-header .user-menu { margin-left: auto; display: flex; align-items: center; }
        .app-header .user-menu .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            font-size: 0.65rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }
        .red-line { height: 2px; background: #dc2626; }
        .main-content {
            flex: 1;
            min-width: 0;
            padding: 1rem 1.5rem;
            max-width: 80rem;
            margin: 0 auto;
            width: 100%;
        }
        .info-box {
            border: 1px solid #e2e8f0;
            font-size: 0.875rem;
            width: 100%;
        }
        .info-box .info-header {
            background: #f1f5f9;
            padding: 0.375rem 1rem;
            font-weight: 600;
            color: #0f172a;
            border-bottom: 1px solid #e2e8f0;
        }
        .info-box .info-row {
            display: grid;
            grid-template-columns: 160px 1fr 160px 1fr;
            gap: 1.5rem;
            padding: 0.5rem 1rem;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
        }
        .info-box .info-row:last-child { border-bottom: none; }
        .info-box .info-row .label { font-weight: 600; color: #0f172a; white-space: nowrap; }
        .info-box .info-row .value { font-weight: 600; color: #0f172a; }
        .welcome-section { margin-top: 2.5rem; }
        .welcome-section h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.125rem; color: #0f172a; }
        .welcome-section h2 { font-size: 1rem; font-weight: 600; color: #0f172a; margin-bottom: 1rem; }
        .search-bar {
            position: relative;
            width: 12rem;
            margin-bottom: 1.25rem;
        }
        .search-bar input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #e2e8f0;
            background: transparent;
            padding: 0.25rem 0 0.25rem 2rem;
            height: 2.25rem;
            font-size: 0.875rem;
            border-radius: 0;
            font-family: 'Inter', sans-serif;
            color: #0f172a;
        }
        .search-bar input:focus { outline: none; border-bottom-color: #2563eb; }
        .search-bar .icon {
            position: absolute;
            left: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }
        .exam-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        @media (min-width: 640px) { .exam-grid { grid-template-columns: repeat(3, 1fr); } }
