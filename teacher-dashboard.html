<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - HAYYO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .teacher-header {
            background: linear-gradient(135deg, #2d3436 0%, #636e72 100%);
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s;
            border-left: 4px solid #2d3436;
            cursor: pointer;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: #2d3436;
        }
        .stat-card .label {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .stat-card .icon {
            font-size: 2.5rem;
            opacity: 0.3;
            float: right;
        }
        .stat-card.primary { border-left-color: #0984e3; }
        .stat-card.success { border-left-color: #00b894; }
        .stat-card.warning { border-left-color: #fdcb6e; }
        .stat-card.danger { border-left-color: #e17055; }
        .stat-card.info { border-left-color: #74b9ff; }
        .stat-card.purple { border-left-color: #6c5ce7; }

        .exam-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            transition: all 0.3s;
            border-left: 5px solid #0984e3;
        }
        .exam-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 25px rgba(0,0,0,0.12);
        }
        .exam-card .exam-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #2d3436;
        }
        .exam-card .exam-meta {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .exam-status {
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .exam-status.active {
            background: #d4edda;
            color: #155724;
        }
        .exam-status.inactive {
            background: #f8d7da;
            color: #721c24;
        }
        .exam-status.draft {
            background: #fff3cd;
            color: #856404;
        }

        .quick-actions .btn {
            border-radius: 50px;
            padding: 10px 25px;
            margin: 5px;
        }
        .feedback-msg {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 400px;
        }
        .chart-container {
            position: relative;
            height: 250px;
        }
        .activity-item {
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .activity-icon.blue { background: #dbeafe; color: #1e40af; }
        .activity-icon.green { background: #d1fae5; color: #065f46; }
        .activity-icon.yellow { background: #fef3c7; color: #92400e; }
        .activity-icon.red { background: #fee2e2; color: #991b1b; }
        .activity-icon.purple { background: #ede9fe; color: #5b21b6; }
        .activity-text {
            flex: 1;
        }
        .activity-text .title {
            font-weight: 500;
            color: #1a1a2e;
        }
        .activity-text .time {
            font-size: 0.8rem;
            color: #6c757d;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }
        .empty-state .icon {
            font-size: 4rem;
            opacity: 0.3;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <!-- Feedback Messages -->
    <div class="feedback-msg" id="feedbackMsg"></div>

    <!-- Teacher Header -->
    <div class="teacher-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1 class="display-6 fw-bold mb-2">
                        <i class="bi bi-person-badge me-2"></i>Teacher Dashboard
                    </h1>
                    <p class="mb-0 opacity-75" id="teacherName">Welcome back, Teacher!</p>
                </div>
                <div class="col-md-6 text-md-end mt-3 mt-md-0">
                    <button class="btn btn-light me-2" onclick="refreshData()">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                    <a href="teacher-exam-edit.html" class="btn btn-success">
                        <i class="bi bi-plus-circle"></i> Create New Exam
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mb-5">
        <!-- Statistics -->
        <div class="row g-4 mb-4">
            <div class="col-md-3 col-sm-6">
                <div class="stat-card primary">
                    <div class="icon"><i class="bi bi-journal"></i></div>
                    <div class="number" id="totalExams">0</div>
                    <div class="label">Total Exams</div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="stat-card success">
                    <div class="icon"><i class="bi bi-people"></i></div>
                    <div class="number" id="totalStudents">0</div>
                    <div class="label">Total Students</div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="stat-card warning">
                    <div class="icon"><i class="bi bi-check-circle"></i></div>
                    <div class="number" id="totalSubmissions">0</div>
                    <div class="label">Submissions</div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="stat-card purple">
                    <div class="icon"><i class="bi bi-trophy"></i></div>
                    <div class="number" id="avgScore">0%</div>
                    <div class="label">Average Score</div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions mb-4 text-center">
            <a href="teacher-exam-edit.html" class="btn btn-primary">
                <i class="bi bi-file-earmark-plus"></i> New Exam
            </a>
            <a href="teacher-question-edit.html" class="btn btn-info text-white">
                <i class="bi bi-question-circle"></i> Add Questions
            </a>
            <button class="btn btn-warning" onclick="viewResults()">
                <i class="bi bi-bar-chart"></i> View Results
            </button>
            <button class="btn btn-secondary" onclick="viewPayments()">
                <i class="bi bi-credit-card"></i> Payments
            </button>
        </div>

        <!-- Charts Row -->
        <div class="row g-4 mb-4">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-light">
                        <h5 class="mb-0"><i class="bi bi-graph-up me-2"></i>Performance Overview</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="performanceChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-light">
                        <h5 class="mb-0"><i class="bi bi-pie-chart me-2"></i>Exam Status</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Exams & Activity -->
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-journal me-2"></i>Recent Exams</h5>
                        <a href="#" class="text-decoration-none">View All</a>
                    </div>
                    <div class="card-body" id="recentExams">
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-light">
                        <h5 class="mb-0"><i class="bi bi-clock-history me-2"></i>Recent Activity</h5>
                    </div>
                    <div class="card-body" id="recentActivity">
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ============================================================
        // 1. API Base URL - UPDATED
        // ============================================================
        const API_BASE = 'https://hayyo-exam.onrender.com';

        // ============================================================
        // 2. Global State
        // ============================================================
        let dashboardData = null;
        let performanceChart = null;
        let statusChart = null;

        // DOM elements
        const teacherName = document.getElementById('teacherName');
        const totalExams = document.getElementById('totalExams');
        const totalStudents = document.getElementById('totalStudents');
        const totalSubmissions = document.getElementById('totalSubmissions');
        const avgScore = document.getElementById('avgScore');
        const recentExams = document.getElementById('recentExams');
        const recentActivity = document.getElementById('recentActivity');
        const feedbackMsg = document.getElementById('feedbackMsg');

        // ============================================================
        // 3. Helper Functions
        // ============================================================
        function showFeedback(message, type = 'success') {
            const bgColor = type === 'success' ? '#d4edda' : type === 'error' ? '#f8d7da' : '#fff3cd';
            const textColor = type === 'success' ? '#155724' : type === 'error' ? '#721c24' : '#856404';
            feedbackMsg.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert" style="background: ${bgColor}; color: ${textColor}; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => {
                const alert = feedbackMsg.querySelector('.alert');
                if (alert) alert.classList.remove('show');
            }, 5000);
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            const now = new Date();
            const diff = now - date;
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function getStatusClass(status) {
            const map = {
                'active': 'exam-status active',
                'inactive': 'exam-status inactive',
                'draft': 'exam-status draft'
            };
            return map[status] || 'exam-status draft';
        }

        function getActivityIcon(type) {
            const map = {
                'exam_created': 'blue bi-file-earmark-plus',
                'exam_updated': 'yellow bi-pencil',
                'submission': 'green bi-check-circle',
                'student_joined': 'purple bi-person-plus',
                'payment': 'green bi-credit-card',
                'result_viewed': 'blue bi-eye'
            };
            return map[type] || 'blue bi-circle';
        }

        function getActivityColor(type) {
            const map = {
                'exam_created': 'blue',
                'exam_updated': 'yellow',
                'submission': 'green',
                'student_joined': 'purple',
                'payment': 'green',
                'result_viewed': 'blue'
            };
            return map[type] || 'blue';
        }

        // ============================================================
        // 4. Load Dashboard Data
        // ============================================================
        function loadDashboard() {
            fetch(`${API_BASE}/api/teacher/dashboard`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    dashboardData = data;
                    renderDashboard(data);
                } else {
                    showFeedback('Failed to load dashboard: ' + data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Load dashboard error:', error);
                showFeedback('Network error loading dashboard.', 'error');
            });
        }

        // ============================================================
        // 5. Render Dashboard
        // ============================================================
        function renderDashboard(data) {
            // Teacher name
            teacherName.textContent = `Welcome back, ${data.teacher_name || 'Teacher'}!`;

            // Stats
            totalExams.textContent = data.total_exams || 0;
            totalStudents.textContent = data.total_students || 0;
            totalSubmissions.textContent = data.total_submissions || 0;
            avgScore.textContent = `${data.avg_score || 0}%`;

            // Recent exams
            renderRecentExams(data.recent_exams || []);

            // Recent activity
            renderRecentActivity(data.recent_activity || []);

            // Charts
            renderPerformanceChart(data.performance_data || { labels: [], values: [] });
            renderStatusChart(data.status_data || { labels: [], values: [] });
        }

        // ============================================================
        // 6. Render Recent Exams
        // ============================================================
        function renderRecentExams(exams) {
            if (!exams || exams.length === 0) {
                recentExams.innerHTML = `
                    <div class="empty-state">
                        <div class="icon"><i class="bi bi-journal"></i></div>
                        <p>No exams created yet.</p>
                        <a href="teacher-exam-edit.html" class="btn btn-primary btn-sm">
                            <i class="bi bi-plus-circle"></i> Create First Exam
                        </a>
                    </div>
                `;
                return;
            }

            recentExams.innerHTML = exams.map(exam => `
                <div class="exam-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="exam-title">${exam.title || 'Untitled Exam'}</div>
                            <div class="exam-meta">
                                <i class="bi bi-people me-1"></i>${exam.student_count || 0} students
                                <span class="mx-2">•</span>
                                <i class="bi bi-check-circle me-1"></i>${exam.submission_count || 0} submissions
                                <span class="mx-2">•</span>
                                <i class="bi bi-clock me-1"></i>${formatDate(exam.created_at)}
                            </div>
                        </div>
                        <span class="${getStatusClass(exam.status)}">${exam.status || 'draft'}</span>
                    </div>
                    <div class="mt-2 d-flex gap-2">
                        <a href="teacher-exam-edit.html?id=${exam.id}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <a href="teacher-question-edit.html?exam=${exam.id}" class="btn btn-sm btn-outline-info">
                            <i class="bi bi-question-circle"></i> Questions
                        </a>
                        <button class="btn btn-sm btn-outline-secondary" onclick="viewExamResults('${exam.id}')">
                            <i class="bi bi-bar-chart"></i> Results
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ============================================================
        // 7. Render Recent Activity
        // ============================================================
        function renderRecentActivity(activities) {
            if (!activities || activities.length === 0) {
                recentActivity.innerHTML = `
                    <div class="empty-state">
                        <div class="icon"><i class="bi bi-clock-history"></i></div>
                        <p>No recent activity</p>
                    </div>
                `;
                return;
            }

            recentActivity.innerHTML = activities.map(activity => `
                <div class="activity-item">
                    <div class="activity-icon ${getActivityColor(activity.type)}">
                        <i class="bi ${getActivityIcon(activity.type)}"></i>
                    </div>
                    <div class="activity-text">
                        <div class="title">${activity.title || 'Activity'}</div>
                        <div class="time">${formatDate(activity.created_at)}</div>
                    </div>
                </div>
            `).join('');
        }

        // ============================================================
        // 8. Render Charts
        // ============================================================
        function renderPerformanceChart(data) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            
            if (performanceChart) {
                performanceChart.destroy();
            }

            performanceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels || ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [{
                        label: 'Average Score',
                        data: data.values || [0, 0, 0, 0, 0, 0],
                        borderColor: '#0984e3',
                        backgroundColor: 'rgba(9, 132, 227, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#0984e3',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: {
                                color: 'rgba(0,0,0,0.05)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
        }

        function renderStatusChart(data) {
            const ctx = document.getElementById('statusChart').getContext('2d');
            
            if (statusChart) {
                statusChart.destroy();
            }

            statusChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: data.labels || ['Active', 'Inactive', 'Draft'],
                    datasets: [{
                        data: data.values || [0, 0, 0],
                        backgroundColor: ['#00b894', '#e17055', '#fdcb6e'],
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 10,
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        }
                    },
                    cutout: '60%'
                }
            });
        }

        // ============================================================
        // 9. Actions
        // ============================================================
        function refreshData() {
            showFeedback('Refreshing dashboard...', 'info');
            loadDashboard();
        }

        function viewResults() {
            window.location.href = 'results.html';
        }

        function viewPayments() {
            window.location.href = 'admin-payments.html';
        }

        function viewExamResults(examId) {
            window.location.href = `results.html?exam=${examId}`;
        }

        // ============================================================
        // 10. Initialize
        // ============================================================
        document.addEventListener('DOMContentLoaded', loadDashboard);

        // Make functions globally accessible
        window.refreshData = refreshData;
        window.viewResults = viewResults;
        window.viewPayments = viewPayments;
        window.viewExamResults = viewExamResults;
    </script>
</body>
</html>
