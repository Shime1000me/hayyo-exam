<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematics Exam - HAYYO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .timer-danger {
            color: #dc3545;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .exam-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .question-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            border-left: 5px solid #667eea;
            transition: transform 0.2s;
        }
        .question-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 25px rgba(0,0,0,0.12);
        }
        .question-number {
            background: #667eea;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 10px;
        }
        .option-label {
            display: block;
            padding: 12px 20px;
            margin: 8px 0;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-label:hover {
            background: #f8f9fa;
            border-color: #667eea;
        }
        .option-label input[type="radio"] {
            margin-right: 12px;
        }
        .option-label.selected {
            background: #e7f0ff;
            border-color: #667eea;
        }
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            color: white;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .timer-box {
            background: rgba(255,255,255,0.15);
            padding: 12px 25px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            display: inline-block;
        }
        .progress-bar-custom {
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            margin-top: 10px;
        }
        .progress-bar-fill {
            height: 100%;
            background: #4ade80;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .exam-info {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .subject-badge {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .question-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #2d3748;
        }
        .question-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 15px 0;
            max-height: 300px;
            object-fit: contain;
        }
        .feedback-msg {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 400px;
        }
        .modal-content {
            border-radius: 20px;
            border: none;
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px 20px 0 0;
        }
        .btn-close-white {
            filter: brightness(0) invert(1);
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }
        .summary-item:last-child {
            border-bottom: none;
        }
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .status-answered {
            background: #d4edda;
            color: #155724;
        }
        .status-unanswered {
            background: #f8d7da;
            color: #721c24;
        }
        .status-marked {
            background: #fff3cd;
            color: #856404;
        }

        /* DEBUG BOX */
        .debug-box {
            background: #1e1e2e;
            color: #cdd6f4;
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #313244;
        }
        .debug-box .label {
            color: #89b4fa;
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
        }
        .debug-box .success { color: #a6e3a1; }
        .debug-box .error { color: #f38ba8; }
        .debug-box .info { color: #89b4fa; }
        .debug-box .warn { color: #f9e2af; }
    </style>
</head>
<body>
    <!-- Feedback Messages -->
    <div class="feedback-msg" id="feedbackMsg"></div>

    <!-- Exam Header -->
    <div class="exam-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1 class="display-6 fw-bold mb-2">
                        <i class="bi bi-calculator-fill me-2"></i>Mathematics Exam
                    </h1>
                    <div class="exam-info">
                        <span class="subject-badge me-2"><i class="bi bi-tag me-1"></i>Mathematics</span>
                        <span id="studentName" class="subject-badge"><i class="bi bi-person me-1"></i>Loading...</span>
                    </div>
                </div>
                <div class="col-md-6 text-md-end">
                    <div class="timer-box">
                        <i class="bi bi-clock me-2"></i>
                        <span id="timerDisplay">--:--</span>
                    </div>
                    <div class="progress-bar-custom">
                        <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
                    </div>
                    <div class="mt-2">
                        <small>Questions: <span id="answeredCount">0</span>/<span id="totalQuestions">0</span></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mb-5">
        <div class="row">
            <div class="col-lg-8">
                <!-- Questions Container -->
                <div id="questionsContainer">
                    <!-- Questions will be loaded here -->
                </div>

                <!-- Navigation Buttons -->
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <button class="btn btn-outline-secondary btn-lg" id="prevBtn" disabled>
                        <i class="bi bi-arrow-left"></i> Previous
                    </button>
                    <div>
                        <span class="badge bg-primary fs-6" id="questionCounter">1 / 0</span>
                    </div>
                    <button class="btn btn-outline-primary btn-lg" id="nextBtn">
                        Next <i class="bi bi-arrow-right"></i>
                    </button>
                </div>

                <!-- Action Buttons -->
                <div class="row mt-4 g-3">
                    <div class="col-md-4">
                        <button class="btn btn-warning w-100 btn-lg" id="markReviewBtn">
                            <i class="bi bi-flag"></i> Mark for Review
                        </button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-danger w-100 btn-lg" id="clearResponseBtn">
                            <i class="bi bi-x-circle"></i> Clear Response
                        </button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-success w-100 btn-lg" id="submitExamBtn">
                            <i class="bi bi-check-circle"></i> Submit Exam
                        </button>
                    </div>
                </div>
            </div>

            <!-- Question Palette -->
            <div class="col-lg-4 mt-4 mt-lg-0">
                <div class="card shadow-sm">
                    <div class="card-header bg-light">
                        <h5 class="mb-0"><i class="bi bi-grid-3x3-gap-fill me-2"></i>Question Palette</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-3">
                            <span><span class="badge bg-success">●</span> Answered</span>
                            <span><span class="badge bg-danger">●</span> Unanswered</span>
                            <span><span class="badge bg-warning">●</span> Review</span>
                        </div>
                        <div id="questionPalette" class="d-flex flex-wrap gap-2">
                            <!-- Palette will be loaded here -->
                        </div>
                        <hr>
                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" id="reviewAllBtn">
                                <i class="bi bi-eye"></i> Review All
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Exam Instructions -->
                <div class="card shadow-sm mt-3">
                    <div class="card-header bg-light">
                        <h5 class="mb-0"><i class="bi bi-info-circle me-2"></i>Instructions</h5>
                    </div>
                    <div class="card-body">
                        <ul class="list-unstyled mb-0">
                            <li><i class="bi bi-check-circle text-success me-2"></i>Answer all questions</li>
                            <li><i class="bi bi-clock text-primary me-2"></i>Time limit: 3 hours</li>
                            <li><i class="bi bi-flag text-warning me-2"></i>Mark for review if unsure</li>
                            <li><i class="bi bi-check2-all text-info me-2"></i>Review before submission</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Submit Confirmation Modal -->
    <div class="modal fade" id="submitModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-check-circle me-2"></i>Confirm Submission</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="submissionSummary">
                        <!-- Summary will be loaded here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Review Again</button>
                    <button class="btn btn-success" id="confirmSubmitBtn">
                        <i class="bi bi-check-circle"></i> Submit Exam
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== DEBUG BOX ===== -->
    <div class="container">
        <div class="debug-box" id="debugBox">
            <span class="label">🔍 Debug Log:</span>
            <div id="debugContent">Waiting for page to load...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ============================================================
        // 1. API Configuration
        // ============================================================
        const API_BASE = 'https://hayyo-exam.onrender.com';
        const debugContent = document.getElementById('debugContent');

        function logDebug(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warn' ? '⚠️' : '🔍';
            const color = type === 'success' ? '#a6e3a1' : type === 'error' ? '#f38ba8' : type === 'warn' ? '#f9e2af' : '#89b4fa';
            debugContent.innerHTML += `<div style="color:${color}">${prefix} [${timestamp}] ${message}</div>`;
            console.log(`${prefix} ${message}`);
        }

        function showFeedback(message, type = 'success') {
            const bgColor = type === 'success' ? '#d4edda' : type === 'error' ? '#f8d7da' : '#fff3cd';
            const textColor = type === 'success' ? '#155724' : type === 'error' ? '#721c24' : '#856404';
            document.getElementById('feedbackMsg').innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert" style="background: ${bgColor}; color: ${textColor}; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => {
                const alert = document.querySelector('#feedbackMsg .alert');
                if (alert) alert.classList.remove('show');
            }, 5000);
        }

        // ============================================================
        // 2. Global State
        // ============================================================
        let examData = {
            questions: [],
            studentName: '',
            studentId: '',
            examId: '',
            startTime: null,
            timeLimit: 180,
        };

        let userAnswers = {};
        let reviewStatus = {};
        let currentQuestionIndex = 0;
        let timerInterval = null;
        let timeRemaining = 0;
        let isExamSubmitted = false;

        // DOM elements
        const questionsContainer = document.getElementById('questionsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const questionCounter = document.getElementById('questionCounter');
        const timerDisplay = document.getElementById('timerDisplay');
        const progressBar = document.getElementById('progressBar');
        const answeredCount = document.getElementById('answeredCount');
        const totalQuestions = document.getElementById('totalQuestions');
        const questionPalette = document.getElementById('questionPalette');
        const markReviewBtn = document.getElementById('markReviewBtn');
        const clearResponseBtn = document.getElementById('clearResponseBtn');
        const submitExamBtn = document.getElementById('submitExamBtn');
        const confirmSubmitBtn = document.getElementById('confirmSubmitBtn');
        const reviewAllBtn = document.getElementById('reviewAllBtn');
        const submitModal = new bootstrap.Modal(document.getElementById('submitModal'));

        // ============================================================
        // 3. Helper Functions
        // ============================================================
        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            if (hours > 0) {
                return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function getAnsweredCount() {
            return Object.keys(userAnswers).filter(key => userAnswers[key] !== undefined && userAnswers[key] !== null).length;
        }

        function updateProgress() {
            const total = examData.questions.length;
            const answered = getAnsweredCount();
            answeredCount.textContent = answered;
            totalQuestions.textContent = total;
            const percentage = total > 0 ? (answered / total) * 100 : 0;
            progressBar.style.width = `${percentage}%`;
            renderPalette();
        }

        function getToken() {
            return localStorage.getItem('token');
        }

        // ============================================================
        // 4. Render Functions
        // ============================================================
        function renderQuestion(index) {
            const questions = examData.questions;
            if (!questions || questions.length === 0 || index >= questions.length) {
                logDebug('⚠️ No questions to render', 'warn');
                return;
            }

            const q = questions[index];
            const isAnswered = userAnswers[index] !== undefined && userAnswers[index] !== null;
            const isReviewed = reviewStatus[index] === true;

            let html = `<div class="question-card">
                <div class="d-flex align-items-start mb-3">
                    <span class="question-number">${index + 1}</span>
                    <div class="flex-grow-1">
                        <span class="badge bg-secondary me-2">${q.marks || 1} mark${q.marks > 1 ? 's' : ''}</span>
                        ${isReviewed ? '<span class="badge bg-warning text-dark"><i class="bi bi-flag"></i> Review</span>' : ''}
                    </div>
                </div>
                <div class="question-text">${q.text || q.question_text || 'Question text not available'}</div>
                ${q.image_url ? `<img src="${q.image_url}" alt="Question image" class="question-image">` : ''}
                <div class="options-container">`;

            const options = q.options || [];
            if (options.length > 0) {
                options.forEach((opt, optIndex) => {
                    const optText = typeof opt === 'string' ? opt : (opt.option_text || opt.text || '');
                    const isSelected = (userAnswers[index] === optIndex);
                    const selectedClass = isSelected ? 'selected' : '';
                    html += `
                        <label class="option-label ${selectedClass}" data-q="${index}" data-opt="${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" ${isSelected ? 'checked' : ''}>
                            ${String.fromCharCode(65 + optIndex)}. ${optText}
                        </label>
                    `;
                });
            } else {
                html += `<p class="text-muted">No options available for this question.</p>`;
            }

            html += `</div></div>`;
            questionsContainer.innerHTML = html;

            questionCounter.textContent = `${index + 1} / ${questions.length}`;
            prevBtn.disabled = (index === 0);
            nextBtn.disabled = (index === questions.length - 1);

            markReviewBtn.textContent = isReviewed ? 'Remove Review' : 'Mark for Review';
            markReviewBtn.className = isReviewed ? 'btn btn-outline-warning w-100 btn-lg' : 'btn btn-warning w-100 btn-lg';

            document.querySelectorAll('.option-label').forEach(label => {
                label.addEventListener('click', function(e) {
                    const qIndex = parseInt(this.dataset.q);
                    const optIndex = parseInt(this.dataset.opt);
                    selectOption(qIndex, optIndex);
                });
            });

            document.querySelectorAll('.palette-item').forEach(item => {
                item.classList.remove('border-primary', 'border-2');
                if (parseInt(item.dataset.index) === index) {
                    item.classList.add('border-primary', 'border-2');
                }
            });
        }

        function renderPalette() {
            const questions = examData.questions;
            if (!questions || questions.length === 0) {
                questionPalette.innerHTML = '<p class="text-muted">No questions loaded</p>';
                return;
            }

            let html = '';
            questions.forEach((q, index) => {
                const isAnswered = userAnswers[index] !== undefined && userAnswers[index] !== null;
                const isReviewed = reviewStatus[index] === true;
                let bgClass = 'bg-secondary';
                if (isAnswered) bgClass = 'bg-success';
                else if (isReviewed) bgClass = 'bg-warning';
                else bgClass = 'bg-danger';

                html += `
                    <button class="btn ${bgClass} text-white palette-item" 
                            data-index="${index}" 
                            style="width: 40px; height: 40px; border-radius: 8px; font-weight: bold; padding: 0;"
                            title="Q${index + 1}${isAnswered ? ' (Answered)' : ''}${isReviewed ? ' (Review)' : ''}">
                        ${index + 1}
                    </button>
                `;
            });
            questionPalette.innerHTML = html;

            document.querySelectorAll('.palette-item').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.dataset.index);
                    currentQuestionIndex = index;
                    renderQuestion(index);
                });
            });
        }

        // ============================================================
        // 5. Core Functions
        // ============================================================
        function selectOption(qIndex, optIndex) {
            if (isExamSubmitted) {
                showFeedback('Exam already submitted. Cannot change answers.', 'error');
                return;
            }
            userAnswers[qIndex] = optIndex;
            renderQuestion(currentQuestionIndex);
            updateProgress();
            saveToLocalStorage();
        }

        function markForReview() {
            if (isExamSubmitted) {
                showFeedback('Exam already submitted.', 'error');
                return;
            }
            const current = currentQuestionIndex;
            reviewStatus[current] = !reviewStatus[current];
            renderQuestion(current);
            renderPalette();
            saveToLocalStorage();
            showFeedback(reviewStatus[current] ? 'Marked for review' : 'Removed from review', 'info');
        }

        function clearResponse() {
            if (isExamSubmitted) {
                showFeedback('Exam already submitted.', 'error');
                return;
            }
            const current = currentQuestionIndex;
            delete userAnswers[current];
            renderQuestion(current);
            updateProgress();
            saveToLocalStorage();
            showFeedback('Response cleared', 'info');
        }

        function navigateQuestion(direction) {
            const total = examData.questions.length;
            const newIndex = currentQuestionIndex + direction;
            if (newIndex >= 0 && newIndex < total) {
                currentQuestionIndex = newIndex;
                renderQuestion(currentQuestionIndex);
            }
        }

        // ============================================================
        // 6. Timer Functions
        // ============================================================
        function startTimer() {
            if (!examData.startTime) {
                examData.startTime = Date.now();
            }
            const elapsed = (Date.now() - examData.startTime) / 1000;
            timeRemaining = Math.max(0, (examData.timeLimit * 60) - elapsed);
            updateTimerDisplay();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    showFeedback('Time is up! Auto-submitting...', 'error');
                    submitExam();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = formatTime(timeRemaining);
            if (timeRemaining < 300) {
                timerDisplay.className = 'timer-danger';
            } else {
                timerDisplay.className = '';
            }
        }

        // ============================================================
        // 7. Submit Exam
        // ============================================================
        function submitExam() {
            if (isExamSubmitted) return;
            isExamSubmitted = true;
            clearInterval(timerInterval);
            submitExamBtn.disabled = true;

            const total = examData.questions.length;
            let correct = 0;
            let wrong = 0;
            let unanswered = 0;
            let totalMarks = 0;
            let obtainedMarks = 0;
            let correctAnswers = 0;

            const answers = examData.questions.map((q, index) => {
                const selected = userAnswers[index] !== undefined ? userAnswers[index] : null;
                const options = q.options || [];
                const isCorrect = selected !== null && options[selected] && (options[selected].is_correct === true || options[selected].isCorrect === true);
                const marks = q.marks || 1;
                if (selected !== null) {
                    if (isCorrect) {
                        correct++;
                        obtainedMarks += marks;
                        totalMarks += marks;
                        correctAnswers++;
                    } else {
                        wrong++;
                        totalMarks += marks;
                    }
                } else {
                    unanswered++;
                    totalMarks += marks;
                }
                return {
                    question_id: q.id || index,
                    selected_option: selected,
                    is_correct: isCorrect || false
                };
            });

            const payload = {
                exam_id: examData.examId,
                student_id: examData.studentId,
                answers: answers,
                time_taken: Math.floor((Date.now() - examData.startTime) / 1000),
                total_marks: totalMarks,
                obtained_marks: obtainedMarks,
                correct_answers: correctAnswers,
                wrong_answers: wrong,
                unanswered: unanswered
            };

            fetch(`${API_BASE}/api/exams/submit`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + getToken()
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showFeedback('Exam submitted successfully!', 'success');
                    localStorage.removeItem(`exam_${examData.examId}`);
                    setTimeout(() => {
                        window.location.href = `results.html?exam=${examData.examId}&student=${examData.studentId}`;
                    }, 2000);
                } else {
                    showFeedback('Error submitting exam: ' + (data.message || data.error), 'error');
                    isExamSubmitted = false;
                    submitExamBtn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Submit error:', error);
                showFeedback('Network error. Please try again.', 'error');
                isExamSubmitted = false;
                submitExamBtn.disabled = false;
            });
        }

        // ============================================================
        // 8. Local Storage
        // ============================================================
        function saveToLocalStorage() {
            const data = {
                userAnswers,
                reviewStatus,
                currentQuestionIndex,
                startTime: examData.startTime,
                timeRemaining
            };
            try {
                localStorage.setItem(`exam_${examData.examId}`, JSON.stringify(data));
            } catch (e) {
                console.error('Save to localStorage error:', e);
            }
        }

        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem(`exam_${examData.examId}`);
                if (saved) {
                    const data = JSON.parse(saved);
                    userAnswers = data.userAnswers || {};
                    reviewStatus = data.reviewStatus || {};
                    currentQuestionIndex = data.currentQuestionIndex || 0;
                    if (data.startTime) examData.startTime = data.startTime;
                    if (data.timeRemaining) timeRemaining = data.timeRemaining;
                    return true;
                }
            } catch (e) {
                console.error('Load from localStorage error:', e);
            }
            return false;
        }

        // ============================================================
        // 9. Load Exam Data - FIXED
        // ============================================================
        function loadExam() {
            logDebug('📄 Maths Exam page loaded', 'info');
            
            const urlParams = new URLSearchParams(window.location.search);
            const examId = urlParams.get('exam');
            const token = getToken();

            if (!examId) {
                logDebug('❌ No exam ID provided in URL', 'error');
                showFeedback('Invalid exam link. Please contact your teacher.', 'error');
                return;
            }

            if (!token) {
                logDebug('❌ No token found', 'error');
                showFeedback('Please login first.', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
                return;
            }

            examData.examId = examId;
            examData.studentId = 'student';
            logDebug(`🔍 Loading exam: ${examId}`, 'info');

            // Fetch exam data from the correct endpoint
            fetch(`${API_BASE}/api/exams/${examId}`, {
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                logDebug(`📡 Response status: ${response.status}`, response.ok ? 'success' : 'warn');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                const exam = data.exam || data;
                logDebug(`✅ Exam loaded: ${exam.title}`, 'success');
                
                if (!exam || !exam.id) {
                    throw new Error('Invalid exam data');
                }

                // Try to fetch questions
                return fetch(`${API_BASE}/api/exams/${examId}/questions`, {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                })
                .then(qRes => {
                    if (qRes.ok) {
                        return qRes.json();
                    }
                    return null;
                })
                .then(qData => {
                    if (qData && qData.questions && qData.questions.length > 0) {
                        examData.questions = qData.questions;
                        logDebug(`✅ Loaded ${examData.questions.length} questions from API`, 'success');
                    } else {
                        // Fallback: use placeholder questions
                        examData.questions = [
                            { id: 1, question_number: 1, text: 'What is 2 + 2?', options: [{option_text: '3', is_correct: false}, {option_text: '4', is_correct: true}, {option_text: '5', is_correct: false}, {option_text: '6', is_correct: false}], marks: 1 },
                            { id: 2, question_number: 2, text: 'What is the square root of 16?', options: [{option_text: '2', is_correct: false}, {option_text: '3', is_correct: false}, {option_text: '4', is_correct: true}, {option_text: '5', is_correct: false}], marks: 1 },
                            { id: 3, question_number: 3, text: 'Solve: 5x = 20', options: [{option_text: 'x = 2', is_correct: false}, {option_text: 'x = 3', is_correct: false}, {option_text: 'x = 4', is_correct: true}, {option_text: 'x = 5', is_correct: false}], marks: 1 }
                        ];
                        logDebug(`ℹ️ Using ${examData.questions.length} placeholder questions`, 'warn');
                    }
                    
                    examData.studentName = localStorage.getItem('userName') || 'Student';
                    examData.timeLimit = exam.time_limit || 180;
                    document.getElementById('studentName').textContent = `👤 ${examData.studentName}`;

                    // Load saved progress
                    const hasSaved = loadFromLocalStorage();
                    if (!hasSaved) {
                        examData.startTime = Date.now();
                        examData.questions.forEach((_, index) => {
                            if (userAnswers[index] === undefined) userAnswers[index] = null;
                        });
                    }

                    totalQuestions.textContent = examData.questions.length;
                    renderQuestion(currentQuestionIndex);
                    renderPalette();
                    updateProgress();
                    startTimer();
                    setInterval(() => saveToLocalStorage(), 30000);
                    showFeedback(`Welcome, ${examData.studentName}! Good luck!`, 'success');
                    logDebug('✅ Exam ready!', 'success');
                });
            })
            .catch(error => {
                logDebug(`❌ Error loading exam: ${error.message}`, 'error');
                console.error('Load exam error:', error);
                showFeedback('Error loading exam. Please contact your teacher.', 'error');
            });
        }

        // ============================================================
        // 10. Event Listeners
        // ============================================================
        prevBtn.addEventListener('click', () => navigateQuestion(-1));
        nextBtn.addEventListener('click', () => navigateQuestion(1));
        markReviewBtn.addEventListener('click', markForReview);
        clearResponseBtn.addEventListener('click', clearResponse);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') navigateQuestion(-1);
            else if (e.key === 'ArrowRight') navigateQuestion(1);
            else if (e.key === 'r' || e.key === 'R') markForReview();
            else if (e.key === 'c' || e.key === 'C') clearResponse();
        });

        submitExamBtn.addEventListener('click', () => {
            if (isExamSubmitted) return;
            const total = examData.questions.length;
            const answered = getAnsweredCount();
            const unanswered = total - answered;
            const reviewed = Object.values(reviewStatus).filter(v => v === true).length;

            document.getElementById('submissionSummary').innerHTML = `
                <h5 class="mb-3">Exam Summary</h5>
                <div class="summary-item"><span>Total Questions</span> <strong>${total}</strong></div>
                <div class="summary-item"><span>Answered</span> <strong class="text-success">${answered}</strong></div>
                <div class="summary-item"><span>Unanswered</span> <strong class="text-danger">${unanswered}</strong></div>
                <div class="summary-item"><span>Marked for Review</span> <strong class="text-warning">${reviewed}</strong></div>
                <hr>
                <div class="alert alert-warning">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    <strong>Warning:</strong> Once submitted, you cannot change your answers.
                </div>
                <button class="btn btn-outline-primary btn-sm" id="reviewUnansweredBtn">
                    <i class="bi bi-eye"></i> Review Unanswered
                </button>
            `;

            setTimeout(() => {
                document.getElementById('reviewUnansweredBtn')?.addEventListener('click', () => {
                    submitModal.hide();
                    for (let i = 0; i < examData.questions.length; i++) {
                        if (userAnswers[i] === undefined || userAnswers[i] === null) {
                            currentQuestionIndex = i;
                            renderQuestion(i);
                            break;
                        }
                    }
                });
            }, 100);

            submitModal.show();
        });

        confirmSubmitBtn.addEventListener('click', () => {
            submitModal.hide();
            setTimeout(submitExam, 500);
        });

        reviewAllBtn.addEventListener('click', () => {
            let i = 0;
            const interval = setInterval(() => {
                if (i >= examData.questions.length) {
                    clearInterval(interval);
                    return;
                }
                currentQuestionIndex = i;
                renderQuestion(i);
                i++;
            }, 800);
        });

        // ============================================================
        // 11. Initialize
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            logDebug('📄 DOM loaded', 'info');
            loadExam();
        });

        window.addEventListener('beforeunload', (e) => {
            if (!isExamSubmitted && Object.keys(userAnswers).length > 0) {
                e.preventDefault();
                e.returnValue = 'You have unsaved progress. Are you sure you want to leave?';
            }
        });
    </script>

</body>
